name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish, such as v2.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: >-
          node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== "v" + version) throw new Error(`Tag must match package.json version: v${version}`)'
      - run: npm run build
      - name: Build installer and portable release assets
        run: npx electron-builder --win nsis portable --publish never
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $artifacts = @(
            @{ Path = "release/GitPilot Setup $version.exe"; Name = "GitPilot-Setup-$version.exe" },
            @{ Path = "release/GitPilot Setup $version.exe.blockmap"; Name = "GitPilot-Setup-$version.exe.blockmap" },
            @{ Path = "release/GitPilot $version.exe"; Name = "GitPilot-$version.exe" },
            @{ Path = "release/latest.yml"; Name = "latest.yml" }
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact.Path)) {
              throw "Build output is missing: $($artifact.Path)"
            }
          }

          $releaseUri = "https://api.github.com/repos/LeurDeLis/GitPilot/releases/tags/$env:RELEASE_TAG"
          try {
            $release = Invoke-RestMethod -Uri $releaseUri -Headers $headers
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/LeurDeLis/GitPilot/releases?per_page=100" -Headers $headers
            $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1
            if ($null -eq $release) {
              $body = @{ tag_name = $env:RELEASE_TAG; name = $env:RELEASE_TAG; draft = $true } | ConvertTo-Json
              $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/LeurDeLis/GitPilot/releases" -Headers $headers -ContentType "application/json" -Body $body
            }
          }

          $assetNames = @($artifacts | ForEach-Object { $_.Name })
          foreach ($asset in @($release.assets)) {
            if ($assetNames -contains $asset.name) {
              Invoke-RestMethod -Method Delete -Uri $asset.url -Headers $headers | Out-Null
            }
          }
          $uploadUri = $release.upload_url -replace '\{\?name,label\}$', ''
          foreach ($artifact in $artifacts) {
            $name = [uri]::EscapeDataString($artifact.Name)
            Invoke-RestMethod -Method Post -Uri "${uploadUri}?name=${name}" -Headers $headers -ContentType "application/octet-stream" -InFile $artifact.Path | Out-Null
          }
          if ($release.draft) {
            $body = @{ draft = $false } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Uri "https://api.github.com/repos/LeurDeLis/GitPilot/releases/$($release.id)" -Headers $headers -ContentType "application/json" -Body $body | Out-Null
          }
      - name: Verify published update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/LeurDeLis/GitPilot/releases/tags/$env:RELEASE_TAG" -Headers $headers
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $requiredAssets = @("latest.yml", "GitPilot-Setup-$version.exe")
          $missingAssets = @($requiredAssets | Where-Object { $release.assets.name -notcontains $_ })
          if ($missingAssets.Count -gt 0) {
            throw "Release $env:RELEASE_TAG is missing required update assets: $($missingAssets -join ', ')"
          }
